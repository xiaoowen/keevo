name: Release

# 发布（ADR-0003 第 6 条）：推送 v* 标签时构建临时签名的 Keevo.app 与 Chrome 扩展，用 Sigstore 无密钥签名发布清单
# （SHA256SUMS），创建发布草稿，人工检查后再发布。
#
# 验证时固定的签名身份：https://github.com/<仓库>/.github/workflows/release.yml@refs/tags/v<版本>
# OIDC issuer：https://token.actions.githubusercontent.com（安装说明：docs/alpha/install.md）
on:
  push:
    tags: ["v*"]

# 默认最小权限；第三方 Action 一律固定到提交 SHA（见 docs/governance.md §4）
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: 构建、签名并创建发布草稿
    runs-on: macos-latest
    permissions:
      contents: write # 创建发布草稿
      id-token: write # Sigstore 无密钥签名所需的 OIDC 令牌
    steps:
      - name: 仓库必须是公开的
        if: github.event.repository.private
        run: |
          echo "仓库仍是私有的：Sigstore 签名会把仓库名、工作流与提交写入公共透明日志。公开仓库后再推送标签。"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: 标签必须与工作区版本一致
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "标签 $GITHUB_REF_NAME 与工作区版本 $VERSION 不一致"
            exit 1
          fi
          if [ ! -f "docs/alpha/release-notes-$VERSION.md" ]; then
            echo "缺少发布说明 docs/alpha/release-notes-$VERSION.md"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: 安装 Rust 工具链、WASM 目标与 wasm-bindgen
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          cargo install --locked wasm-bindgen-cli --version 0.2.130
      - name: 安装 npm 依赖（锁文件，不运行安装脚本）
        working-directory: apps/browser-extension
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 打包（应用实测进程加固，扩展核对版本）
        run: scripts/package-release.sh
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: 用 Sigstore 签名发布清单，并按安装说明的方式验证一次
        working-directory: target/release-artifacts
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - name: 创建发布草稿（人工检查后发布）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft $PRERELEASE --verify-tag \
            --title "Keevo $VERSION" \
            --notes-file "docs/alpha/release-notes-$VERSION.md" \
            target/release-artifacts/Keevo-*.zip \
            target/release-artifacts/SHA256SUMS \
            target/release-artifacts/SHA256SUMS.sigstore.json
