name: CI

on:
  push:
    branches: [master]
  pull_request:

# 默认最小权限；第三方 Action 一律固定到提交 SHA（见 docs/governance.md §4）
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust（fmt · clippy · test）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - name: 格式
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: 测试
        run: cargo test --workspace --locked

  boundaries:
    name: 密码学边界
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-crypto-deps.py

  test-vectors:
    name: 测试向量与参考实现一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 安装哈希锁定的依赖
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes --no-deps -r spec/reference/requirements.txt
      - name: 重新生成并比对
        run: .venv/bin/python -I spec/reference/generate_vectors.py --check

  cargo-deny:
    name: 依赖审查（cargo-deny）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check

  cargo-vet:
    name: 供应链审计（cargo-vet）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 cargo-vet
        run: cargo install --locked cargo-vet@0.10.3
      - name: 检查
        run: cargo vet --locked

  macos-shell:
    name: macOS 空壳应用（Swift → UniFFI → Rust 冒烟测试）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - name: 构建并运行冒烟测试
        run: scripts/build-macos.sh --smoke

  fuzz:
    name: 模糊测试（每个目标 30 秒）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 nightly 与 cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install --locked cargo-fuzz@0.13.1
      - name: 运行全部目标
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" --locked -- -max_total_time=30
          done
