[package]
name = "keevo-ffi"
description = "通过 UniFFI 把 keevo-core 导出给 Swift（macOS 应用）。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "keevo_ffi"

[dependencies]
keevo-core = { path = "../keevo-core" }
keevo-ipc = { path = "../keevo-ipc" }
keevo-service = { path = "../keevo-service" }
uniffi = "0.32"
zeroize = "1"

[dev-dependencies]
keevo-crypto = { path = "../keevo-crypto" }
keevo-format = { path = "../keevo-format" }
serde_json = "1"

[lints]
workspace = true
