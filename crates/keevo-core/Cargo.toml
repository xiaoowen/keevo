[package]
name = "keevo-core"
description = "Keevo 的核心逻辑：账户、解锁状态机、保险库与条目操作。组合 keevo-crypto、keevo-format 与 keevo-store。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
keevo-crypto = { path = "../keevo-crypto" }
keevo-format = { path = "../keevo-format" }
keevo-generator = { path = "../keevo-generator" }
keevo-store = { path = "../keevo-store" }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
url = "2"
zeroize = "1"

[features]
# 测试辅助（例如生成 1PUX 样例的 zip 写入），供其他 crate 的测试使用
test-util = []

[dev-dependencies]
keevo-crypto = { path = "../keevo-crypto", features = ["test-util"] }
keevo-store = { path = "../keevo-store", features = ["test-util"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }

[lints]
workspace = true
