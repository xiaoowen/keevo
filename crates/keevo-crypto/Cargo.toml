[package]
name = "keevo-crypto"
description = "Keevo 的密码学边界：唯一允许直接调用密码学原语的 crate。实现 spec/crypto.md。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.9"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
bcrypt-pbkdf = "0.11"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
ctr = "0.10"
curve25519-dalek = { version = "4", default-features = false, features = ["zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
hex = "0.4"
serde_json = "1"

# 浏览器扩展（wasm32-unknown-unknown）：随机数取自 Web Crypto（crypto.getRandomValues）。
# 还需要 .cargo/config.toml 中的 `getrandom_backend = "wasm_js"`。
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom-v03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
