# cargo-deny 配置：依赖的安全公告、许可证、禁用项与来源检查。
# 规则说明见 docs/governance.md §4。

[graph]
all-features = true

[advisories]
# RustSec 安全公告。任何未修复的漏洞或已停止维护的 crate 都会让 CI 失败。
# 确需忽略时，在这里登记公告 ID、原因和复查日期。
ignore = []

[licenses]
# 只允许与本项目所有组件许可证（MIT OR Apache-2.0、GPL-3.0、AGPL-3.0）都兼容的宽松许可证。
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-wildcard-paths = true
deny = [
    # 不使用 OpenSSL：密码学只走 keevo-crypto 中经过审查的纯 Rust 实现
    { crate = "openssl", reason = "密码学原语只能经由 keevo-crypto" },
    { crate = "openssl-sys", reason = "密码学原语只能经由 keevo-crypto" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
