<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>会员中心</title>
<!-- 自动填充回归语料（合成页面）。预期结果见 keevo-expect：icons 为聚焦各字段后应出现的图标（login、otp，null 为不出现）；
     fills 为填充后各字段的值（anchor 为 null 表示从弹窗填充）。$U、$P、$T 为测试用的用户名、密码与一次性密码。 -->
<script type="application/json" id="keevo-expect">
{
  "title": "登录表单的密码框误标为 new-password",
  "pattern": "唯一的密码框标为 new-password，登录按钮是链接：按登录处理",
  "icons": {
    "#user": "login",
    "#pass": "login"
  },
  "fills": [
    {
      "anchor": "#user",
      "expect": {
        "#user": "$U",
        "#pass": "$P"
      }
    },
    {
      "anchor": "#pass",
      "expect": {
        "#user": "$U",
        "#pass": "$P"
      }
    }
  ]
}
</script>
<body style="margin:40px;font:16px sans-serif">
<form onsubmit="return false"><p><input id="user" placeholder="手机号/用户名" style="width:280px;height:32px"></p><p><input id="pass" type="password" autocomplete="new-password" placeholder="密码" style="width:280px;height:32px"></p><a href="#" style="display:inline-block;padding:6px 12px;background:#06c;color:#fff">登录</a></form>
</body>
</html>
