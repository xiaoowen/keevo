<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>验证码框（autocomplete=one-time-code）</title>
<!-- 自动填充回归语料（合成页面）。预期结果见 keevo-expect：icons 为聚焦各字段后应出现的图标（login、otp，null 为不出现）；
     fills 为填充后各字段的值（anchor 为 null 表示从弹窗填充）。$U、$P、$T 为测试用的用户名、密码与一次性密码。 -->
<script type="application/json" id="keevo-expect">
{
  "title": "验证码框（autocomplete=one-time-code）",
  "pattern": "标准标注",
  "icons": {
    "#otp": "otp"
  },
  "fills": [
    {
      "anchor": "#otp",
      "kind": "otp",
      "expect": {
        "#otp": "$T"
      }
    }
  ]
}
</script>
<body style="margin:40px;font:16px sans-serif">
<form onsubmit="return false"><p><input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" style="width:280px;height:32px"></p><button>验证</button></form>
</body>
</html>
