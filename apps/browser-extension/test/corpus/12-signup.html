     fills 为填充后各字段的值（anchor 为 null 表示从弹窗填充）。$U、$P、$T 为测试用的用户名、密码与一次性密码。 -->
<script type="application/json" id="keevo-expect">

    "#user": "login",
    "#pass": null,
    "#pass2": null
  },
  "fills": [
    {

        "#pass2": ""

<body style="margin:40px;font:16px sans-serif">
<form onsubmit="return false"><p><input id="user" type="text" name="username" style="width:280px;height:32px"></p><p><input id="pass" type="password" autocomplete="new-password" style="width:280px;height:32px"></p><p><input id="pass2" type="password" autocomplete="new-password" style="width:280px;height:32px"></p><button>注册</button></form>
