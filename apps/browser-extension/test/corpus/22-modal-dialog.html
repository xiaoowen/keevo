<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>模态对话框中的登录表单</title>
<!-- 自动填充回归语料（合成页面）。预期结果见 keevo-expect：icons 为聚焦各字段后应出现的图标（login、otp，null 为不出现）；
     fills 为填充后各字段的值（anchor 为 null 表示从弹窗填充）。$U、$P、$T 为测试用的用户名、密码与一次性密码。 -->
<script type="application/json" id="keevo-expect">
{
  "title": "模态对话框中的登录表单",
  "pattern": "showModal() 置于顶层，图标需要出现在对话框之上",
  "icons": {
    "#user": "login",
    "#pass": "login"
  },
  "fills": [
    {
      "anchor": "#user",
      "expect": {
        "#user": "$U",
        "#pass": "$P"
      }
    }
  ]
}
</script>
<body style="margin:40px;font:16px sans-serif">
<dialog id="dlg"><form onsubmit="return false"><p><input id="user" type="text" name="username" style="width:280px;height:32px"></p><p><input id="pass" type="password" name="password" style="width:280px;height:32px"></p><button>登录</button></form></dialog>
<script>document.getElementById("dlg").showModal();</script>
</body>
</html>
