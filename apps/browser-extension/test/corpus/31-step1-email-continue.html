<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Acme</title>
<!-- 自动填充回归语料（合成页面）。预期结果见 keevo-expect：icons 为聚焦各字段后应出现的图标（login、otp，null 为不出现）；
     fills 为填充后各字段的值（anchor 为 null 表示从弹窗填充）。$U、$P、$T 为测试用的用户名、密码与一次性密码。 -->
<script type="application/json" id="keevo-expect">
{
  "title": "分步登录第一步：单独的邮箱框",
  "pattern": "只有一个邮箱框（autocomplete=email），按钮为 Continue，没有密码框",
  "icons": {
    "#email": "login"
  },
  "fills": [
    {
      "anchor": "#email",
      "expect": {
        "#email": "$U"
      }
    },
    {
      "anchor": null,
      "outcome": "no_password_field",
      "expect": {
        "#email": ""
      }
    }
  ]
}
</script>
<body style="margin:40px;font:16px sans-serif">
<form onsubmit="return false"><p><label for="email">Email address</label><br><input id="email" type="email" autocomplete="email" style="width:280px;height:32px"></p><button>Continue</button></form>
</body>
</html>
