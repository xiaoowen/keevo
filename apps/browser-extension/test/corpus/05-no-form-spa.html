<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>单页应用：没有 form 元素</title>
<!-- 自动填充回归语料（合成页面）。预期结果见 keevo-expect：icons 为聚焦各字段后应出现的图标（login、otp，null 为不出现）；
     fills 为填充后各字段的值（anchor 为 null 表示从弹窗填充）。$U、$P、$T 为测试用的用户名、密码与一次性密码。 -->
<script type="application/json" id="keevo-expect">
{
  "title": "单页应用：没有 form 元素",
  "pattern": "输入框直接放在 div 中，按钮是 div[role=button]",
  "icons": {
    "#user": "login",
    "#pass": "login"
  },
  "fills": [
    {
      "anchor": "#user",
      "expect": {
        "#user": "$U",
        "#pass": "$P"
      }
    },
    {
      "anchor": null,
      "expect": {
        "#user": "$U",
        "#pass": "$P"
      }
    }
  ]
}
</script>
<body style="margin:40px;font:16px sans-serif">
<div class="login"><p><input id="user" type="text" placeholder="用户名" style="width:280px;height:32px"></p><p><input id="pass" type="password" style="width:280px;height:32px"></p><div role="button">登录</div></div>
</body>
</html>
