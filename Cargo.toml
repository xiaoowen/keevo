[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
# 发布版本：macOS 应用、扩展与命令行工具都取自这里（scripts/package-macos.sh、scripts/build-extension.sh）
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xiaoowen/keevo"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"

# Argon2 在未优化构建下非常慢；测试也使用优化后的密码学依赖
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true

# 构建期产物（proc-macro、构建脚本）不做 strip：在 macOS 27 + Command Line Tools 上，对 proc-macro
# 执行 strip 后，rustc 无法再加载其元数据（报 E0463 "can't find crate"）。只影响构建过程，不影响发布产物。
[profile.release.build-override]
strip = false
